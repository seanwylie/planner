[project]
name = "planner"
version = "0.1.0"
description = "Idea → gated plan/spec → optional Cursor execute"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Sean Wylie" }]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "boto3>=1.28.0",
    "jsonschema>=4.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/seanwylie/planner"
Repository = "https://github.com/seanwylie/planner"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "templates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: talks to Cursor or a model provider (deselect by default)",
]
